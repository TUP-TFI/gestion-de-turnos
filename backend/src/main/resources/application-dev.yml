spring:
  datasource:
    # Defaults = docker-compose.yml. Se pueden pisar con variables de entorno
    url: ${DB_URL:jdbc:postgresql://localhost:5433/turnos}
    username: ${DB_USERNAME:turnos}
    password: ${DB_PASSWORD:turnos}
  jpa:
    show-sql: true

cors:
  # Servidor de Vite en local. Como el resto del perfil dev, no exige variables
  allowed-origins: http://localhost:5173

app:
  # Direccion del frontend: con ella se arma el link de activacion ({frontend-url}/activate?token=...)
  frontend-url: http://localhost:5173
  jwt:
    # Solo dev: valor publico, no sirve para nada real. Minimo 32 bytes (HS256)
    secret: dev-only-secret-turnos-jwt-0123456789-abcdef
  seed:
    # Solo dev: valores publicos del seed de demo. Se usan si se arranca con APP_SEED_ENABLED=true.
    # Los tests los repiten en SeedTestValues
    password: Turnos.dev.2026
    activation-token: dev-activation-token
