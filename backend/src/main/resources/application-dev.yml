spring:
  datasource:
    # Defaults = docker-compose.yml. Se pueden pisar con variables de entorno
    url: ${DB_URL:jdbc:postgresql://localhost:5433/turnos}
    username: ${DB_USERNAME:turnos}
    password: ${DB_PASSWORD:turnos}
  jpa:
    show-sql: true

cors:
  # Servidor de Vite en local. Como el resto del perfil dev, no exige variables
  allowed-origins: http://localhost:5173
