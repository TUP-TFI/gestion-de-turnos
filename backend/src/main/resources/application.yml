spring:
  application:
    name: turnos
  # Sin perfil por defecto, a proposito: el .jar sin SPRING_PROFILES_ACTIVE no arranca (no hay base ni
  # secreto del JWT). Si fuera dev, en Render se conectaria a Neon con el secreto del JWT y la contraseña
  # del seed que estan en el repo. Solo ./mvnw spring-boot:run y los tests usan dev por defecto (pom.xml)
  jackson:
    deserialization:
      # Un decimal en un campo entero (30.5 en minutos) da 400 en lugar de truncarse a 30
      accept-float-as-int: false
  jpa:
    # La sesion de JPA se cierra al salir del service (regla de capas del README)
    open-in-view: false
    hibernate:
      # El esquema lo define Flyway; Hibernate solo lo verifica
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Instantes siempre en UTC, sin importar la zona del proceso
          time_zone: UTC

server:
  # Render inyecta PORT; en local se usa 8080
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Render usa /actuator/health como health check
        include: health
  endpoint:
    health:
      show-details: never

# Los origenes permitidos por CORS (cors.allowed-origins) los define cada perfil:
# dev usa el Vite local y prod lee la variable CORS_ALLOWED_ORIGINS.

app:
  jwt:
    # Vencimiento del token de sesion del panel
    expiration: 8h
