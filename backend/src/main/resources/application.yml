spring:
  application:
    name: turnos
  profiles:
    # Sin SPRING_PROFILES_ACTIVE se usa dev; Render define prod
    default: dev
  jpa:
    # La sesion de JPA se cierra al salir del service (regla de capas del README)
    open-in-view: false
    hibernate:
      # El esquema lo define Flyway; Hibernate solo lo verifica
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # Instantes siempre en UTC, sin importar la zona del proceso
          time_zone: UTC

server:
  # Render inyecta PORT; en local se usa 8080
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Render usa /actuator/health como health check
        include: health
  endpoint:
    health:
      show-details: never

# Los origenes permitidos por CORS (cors.allowed-origins) los define cada perfil:
# dev usa el Vite local y prod lee la variable CORS_ALLOWED_ORIGINS.
