spring:
  config:
    # Carga backend/.env si existe (corrida local con perfil prod). En Render no existe y se ignora
    import: optional:file:.env[.properties]
  datasource:
    # Sin valores por defecto: si falta una variable, la app no arranca
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Free tier de Neon y Render: pocas conexiones
      maximum-pool-size: 5

cors:
  # Sin valor por defecto: si falta la variable, la app no arranca
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  # Sin valor por defecto: si falta la variable, la app no arranca
  frontend-url: ${FRONTEND_URL}
  jwt:
    # Sin valor por defecto: si falta la variable, la app no arranca. Minimo 32 bytes
    secret: ${JWT_SECRET}
  seed:
    # Solo se leen si APP_SEED_ENABLED=true. Sin valor por defecto: con el seed prendido y sin estas
    # variables, la app no arranca. Nunca usar los valores de application-dev.yml
    password: ${SEED_PASSWORD}
    activation-token: ${SEED_ACTIVATION_TOKEN}
